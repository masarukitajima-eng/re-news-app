name: 不動産ニュース自動更新 & Vercel デプロイ

on:
  schedule:
    # JST (UTC+9) → UTC に変換
    - cron: '0 22 * * *'   # 07:00 JST
    - cron: '0 3 * * *'    # 12:00 JST
    - cron: '0 8 * * *'    # 17:00 JST
    - cron: '0 11 * * *'   # 20:00 JST
  workflow_dispatch:        # 手動実行ボタン

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # コミット・プッシュに必要

    steps:
      # ── 1. コードを取得 ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 全履歴取得（git push に必要）

      # ── 2. Node.js セットアップ ──────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. 依存パッケージインストール ────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Google News RSS からニュース取得・英語記事は Claude で翻訳 ──
      - name: Fetch latest news (Google News RSS + Claude 翻訳)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-and-update.js

      # ── 4a-2. 解説なし記事のリライト（Claude API） ──────
      - name: Rewrite articles without commentary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            node scripts/rewrite-latest.js
          else
            echo "ANTHROPIC_API_KEY 未設定のためリライトスキップ"
          fi

      # ── 4b. 堀江貴文メルマガ取得（Gmail IMAP）──────────
      - name: Fetch Horiemon newsletter (Gmail IMAP)
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_APP_PASSWORD" ]; then
            node scripts/fetch-horie-mail.js
          else
            echo "⚠️  GMAIL_USER / GMAIL_APP_PASSWORD が未設定のため堀江メルマガ取得をスキップ"
          fi

      # ── 5. 変更があるか確認 ──────────────────────────
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/data/mockNews.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "新しい記事なし → デプロイスキップ"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            COUNT=$(git diff --stat src/data/mockNews.ts | tail -1)
            echo "変更あり: $COUNT"
          fi

      # ── 6. コミット & プッシュ ───────────────────────
      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mockNews.ts
          DATETIME=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
          git commit -m "chore: 不動産ニュース自動更新 ${DATETIME}"
          git push

      # ── 7. Vercel 本番デプロイ ───────────────────────
      - name: Deploy to Vercel
        if: steps.diff.outputs.changed == 'true'
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     team_DoaGsm2e48mHgnEsC5wxa88c
          VERCEL_PROJECT_ID: prj_ZCGA39a4ZoIFefUeTSK333Qv45AP
        run: |
          npm install -g vercel@latest --quiet
          vercel deploy --prod --token "$VERCEL_TOKEN" --yes

      # ── 8. サマリー出力 ──────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## 実行結果" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "✅ ニュースを更新して Vercel にデプロイしました" >> $GITHUB_STEP_SUMMARY
            echo "🔗 https://re-news-app.vercel.app" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ 新しい記事なし（デプロイスキップ）" >> $GITHUB_STEP_SUMMARY
          fi
          echo "⏰ 実行時刻: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
